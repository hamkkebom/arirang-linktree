<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아리랑, 130년 전 한국의 보물을 찾다</title>
  <meta name="description" content="헐버트가 시작한 K-컬쳐 — 헐버트의 저서와 유품으로 만나는 아리랑 이야기. 2026년 3월 19일 ~ 4월 19일, 서울 종로구 함께봄 한옥. 무료전시">
  <meta property="og:title" content="아리랑, 130년 전 한국의 보물을 찾다">
  <meta property="og:description" content="헐버트가 시작한 K-컬쳐 — 무료전시 | 2026.3.19 ~ 4.19 | 서울 종로구 함께봄 한옥">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink:        #0F0E0C;
      --ink-soft:   #3D3A35;
      --ink-muted:  #7A7570;
      --cream:      #F5F0E8;
      --cream-deep: #EBE4D8;
      --white:      #FDFCFA;
      --red:        #C23B2E;
      --red-glow:   #E8503F;
      --navy:       #1A3550;
      --navy-light: #2C5A82;
      --gold:       #B8963E;
      --gold-soft:  #D4BA70;
      --border:     #D5CEC3;

      --serif:  'Noto Serif KR', 'Batang', Georgia, serif;
      --sans:   'Noto Sans KR', -apple-system, sans-serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--sans);
      background: var(--cream);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ==========================================
       히어로 섹션 — 포스터급 임팩트
       ========================================== */
    .hero {
      position: relative;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px 48px;
      background: var(--navy);
      color: var(--cream);
      overflow: hidden;
      text-align: center;
    }

    /* 배경 — 전통 격자문양 대담하게 */
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 58px,
          rgba(255,255,255,0.04) 58px,
          rgba(255,255,255,0.04) 60px
        ),
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 58px,
          rgba(255,255,255,0.04) 58px,
          rgba(255,255,255,0.04) 60px
        );
      pointer-events: none;
    }

    /* 배경 — 대형 원형 글로우 */
    .hero::after {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(194,59,46,0.12) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .hero__content {
      position: relative;
      z-index: 1;
      max-width: 480px;
      width: 100%;
    }

    /* 무료전시 뱃지 */
    .hero__badge {
      display: inline-block;
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--gold-soft);
      border: 1px solid var(--gold-soft);
      padding: 5px 18px;
      margin-bottom: 32px;
      animation: fadeIn 0.8s ease both;
    }

    /* 전시명 — 포스터 메인 카피 */
    .hero__title {
      font-family: var(--serif);
      font-weight: 900;
      font-size: clamp(32px, 8vw, 48px);
      line-height: 1.35;
      letter-spacing: -0.03em;
      color: var(--cream);
      margin-bottom: 20px;
      word-break: keep-all;
      animation: titleReveal 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
    }

    .hero__title em {
      font-style: normal;
      color: var(--gold-soft);
    }

    /* 장식 라인 */
    .hero__line {
      width: 48px;
      height: 2px;
      background: var(--gold);
      margin: 0 auto 20px;
      animation: fadeIn 0.8s ease 0.5s both;
    }

    .hero__subtitle {
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: rgba(245,240,232,0.7);
      margin-bottom: 12px;
      animation: fadeSlideUp 0.7s ease 0.6s both;
    }

    .hero__desc {
      font-family: var(--serif);
      font-size: 14px;
      font-weight: 400;
      color: rgba(245,240,232,0.55);
      line-height: 1.8;
      margin-bottom: 36px;
      animation: fadeSlideUp 0.7s ease 0.7s both;
    }

    /* 전시 정보 박스 */
    .hero__info {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 20px 24px;
      width: 100%;
      max-width: 360px;
      margin: 0 auto 24px;
      animation: fadeSlideUp 0.7s ease 0.8s both;
    }

    .hero__info-row {
      display: flex;
      gap: 12px;
      font-size: 13px;
      line-height: 1.65;
      color: rgba(245,240,232,0.75);
    }

    .hero__info-row + .hero__info-row {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .hero__info-label {
      font-weight: 700;
      color: var(--gold-soft);
      white-space: nowrap;
      min-width: 28px;
      font-size: 11px;
      letter-spacing: 0.06em;
    }

    /* 인스타그램 안내 */
    .hero__instagram {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: rgba(245,240,232,0.5);
      margin-top: 4px;
      animation: fadeSlideUp 0.7s ease 0.9s both;
    }

    .hero__instagram svg {
      width: 14px;
      height: 14px;
      opacity: 0.6;
    }

    /* 스크롤 힌트 */
    .hero__scroll {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: rgba(245,240,232,0.3);
      font-size: 10px;
      letter-spacing: 0.1em;
      animation: fadeIn 1s ease 1.2s both;
    }

    .hero__scroll-dot {
      width: 1px;
      height: 24px;
      background: linear-gradient(to bottom, rgba(245,240,232,0.3), transparent);
      animation: scrollPulse 2s ease-in-out infinite;
    }

    @keyframes scrollPulse {
      0%, 100% { opacity: 0.3; transform: scaleY(1); }
      50% { opacity: 0.6; transform: scaleY(1.2); }
    }

    /* ==========================================
       링크 섹션
       ========================================== */
    .links-section {
      padding: 48px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 섹션 장식 — 전통 문양 디바이더 */
    .section-ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 36px;
      width: 100%;
      max-width: 460px;
    }

    .section-ornament__line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--border), transparent);
    }

    .section-ornament__icon {
      width: 20px;
      height: 20px;
    }

    /* 링크 버튼 영역 */
    .links {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 18px 22px;
      background: var(--white);
      border: 1px solid var(--border);
      border-left: 3px solid var(--navy);
      text-decoration: none;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
    }

    .link-btn:hover {
      border-left-color: var(--red);
      background: var(--cream);
      transform: translateX(4px);
      box-shadow: -4px 2px 12px rgba(0,0,0,0.06);
    }

    .link-btn__icon {
      font-size: 22px;
      flex-shrink: 0;
      width: 32px;
      text-align: center;
    }

    .link-btn__text {
      flex: 1;
      letter-spacing: -0.01em;
    }

    .link-btn__arrow {
      font-size: 16px;
      color: var(--ink-muted);
      transition: transform 0.3s ease, color 0.3s ease;
      font-weight: 300;
    }

    .link-btn:hover .link-btn__arrow {
      transform: translateX(4px);
      color: var(--red);
    }

    /* 스태거드 애니메이션 */
    .link-btn { opacity: 0; animation: fadeSlideUp 0.5s ease both; }
    .link-btn:nth-child(1) { animation-delay: 0.1s; }
    .link-btn:nth-child(2) { animation-delay: 0.18s; }
    .link-btn:nth-child(3) { animation-delay: 0.26s; }
    .link-btn:nth-child(4) { animation-delay: 0.34s; }

    /* ==========================================
       QR 코드 섹션
       ========================================== */
    .qr-section {
      padding: 40px 24px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .qr-label {
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-muted);
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }

    .qr-placeholder {
      width: 140px;
      height: 140px;
      border: 2px dashed var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--white);
      position: relative;
    }

    .qr-placeholder__inner {
      font-size: 11px;
      color: var(--ink-muted);
      text-align: center;
      line-height: 1.5;
    }

    /* QR 이미지가 들어갈 때: .qr-placeholder img { width:100%; height:100%; object-fit:contain; } */
    .qr-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .qr-caption {
      font-size: 11px;
      color: var(--ink-muted);
      margin-top: 10px;
    }

    /* ==========================================
       푸터
       ========================================== */
    .footer {
      padding: 32px 24px 40px;
      text-align: center;
      border-top: 1px solid var(--border);
      width: 100%;
      background: var(--cream-deep);
    }

    .footer__social {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .footer__social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 50%;
      text-decoration: none;
      color: var(--ink-muted);
      transition: all 0.3s ease;
    }

    .footer__social-link:hover {
      border-color: var(--navy);
      color: var(--navy);
      transform: translateY(-2px);
    }

    .footer__orgs {
      font-family: var(--serif);
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-soft);
      letter-spacing: 0.02em;
      margin-bottom: 8px;
    }

    .footer__orgs span {
      color: var(--ink-muted);
      font-weight: 400;
      margin: 0 6px;
    }

    .footer__copyright {
      font-size: 11px;
      color: var(--ink-muted);
      line-height: 1.6;
    }

    /* ==========================================
       애니메이션
       ========================================== */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes titleReveal {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ==========================================
       반응형
       ========================================== */
    @media (min-width: 520px) {
      .hero { padding: 80px 32px 56px; }
      .links-section { padding: 56px 32px; }
    }

    @media (max-width: 380px) {
      .hero { padding: 48px 20px 40px; }
      .hero__badge { font-size: 10px; padding: 4px 14px; }
      .hero__info { padding: 16px 18px; }
      .link-btn { padding: 15px 18px; font-size: 14px; }
      .qr-placeholder { width: 120px; height: 120px; }
    }
  </style>
</head>
<body>

  <!-- ============================================================
       히어로 — 전시 포스터 메인 비주얼
       ============================================================ -->
  <section class="hero">
    <div class="hero__content">

      <div class="hero__badge">무료 전시</div>

      <h1 class="hero__title">
        <em>아리랑,</em><br>
        130년 전<br>
        한국의 보물을 찾다
      </h1>

      <div class="hero__line"></div>

      <p class="hero__subtitle">헐버트가 시작한 K-컬쳐</p>

      <p class="hero__desc">
        헐버트의 저서와 유품으로 만나는<br>
        아리랑 이야기
      </p>

      <!-- 전시 정보 -->
      <div class="hero__info">
        <div class="hero__info-row">
          <span class="hero__info-label">기간</span>
          <span>2026. 3. 19(목) — 4. 19(일)</span>
        </div>
        <div class="hero__info-row">
          <span class="hero__info-label">장소</span>
          <span>(주)함께봄 본사 한옥<br>서울 종로구 효자로 7길 10</span>
        </div>
      </div>

      <!-- 인스타그램 안내 -->
      <p class="hero__instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <circle cx="12" cy="12" r="5"/>
          <circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
        전시 관련 상세 행사 일정은 인스타그램으로 안내
      </p>

    </div>

    <div class="hero__scroll">
      <span class="hero__scroll-dot"></span>
    </div>
  </section>

  <!-- ============================================================
       링크 섹션
       ============================================================ -->
  <section class="links-section">

    <!-- 전통 문양 디바이더 -->
    <div class="section-ornament">
      <div class="section-ornament__line"></div>
      <svg class="section-ornament__icon" viewBox="0 0 24 24" fill="none" stroke-width="1.5">
        <path d="M12 2 L22 12 L12 22 L2 12 Z" stroke="#B8963E" fill="none"/>
        <path d="M12 6 L18 12 L12 18 L6 12 Z" stroke="#B8963E" opacity="0.4" fill="none"/>
      </svg>
      <div class="section-ornament__line"></div>
    </div>

    <nav class="links" aria-label="전시 관련 링크">

      <!-- 링크 URL은 href="#"을 실제 URL로 교체하세요 -->

      <a href="#" class="link-btn" target="_blank" rel="noopener">
        <span class="link-btn__icon">❤️‍🔥</span>
        <span class="link-btn__text">기금모금 안내</span>
        <span class="link-btn__arrow">→</span>
      </a>

      <a href="#" class="link-btn" target="_blank" rel="noopener">
        <span class="link-btn__icon">🏛️</span>
        <span class="link-btn__text">전시 홈페이지</span>
        <span class="link-btn__arrow">→</span>
      </a>

      <a href="#" class="link-btn" target="_blank" rel="noopener">
        <span class="link-btn__icon">📋</span>
        <span class="link-btn__text">공모전 안내</span>
        <span class="link-btn__arrow">→</span>
      </a>

      <a href="#" class="link-btn" target="_blank" rel="noopener">
        <span class="link-btn__icon">💌</span>
        <span class="link-btn__text">문의하기</span>
        <span class="link-btn__arrow">→</span>
      </a>

      <!--
        추가 링크:
        <a href="https://..." class="link-btn" target="_blank" rel="noopener">
          <span class="link-btn__icon">🎵</span>
          <span class="link-btn__text">아리랑 음원 듣기</span>
          <span class="link-btn__arrow">→</span>
        </a>
      -->
    </nav>
  </section>

  <!-- ============================================================
       QR 코드 섹션
       ============================================================ -->
  <section class="qr-section">
    <p class="qr-label">전시 관련 QR</p>
    <div class="qr-placeholder">
      <!-- 실제 QR 이미지로 교체: <img src="qr.png" alt="전시 QR 코드"> -->
      <span class="qr-placeholder__inner">QR 코드<br>이미지 삽입</span>
    </div>
    <p class="qr-caption">카메라로 스캔해주세요</p>
  </section>

  <!-- ============================================================
       푸터
       ============================================================ -->
  <footer class="footer">
    <div class="footer__social">
      <a href="#" class="footer__social-link" aria-label="인스타그램" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <circle cx="12" cy="12" r="5"/>
          <circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <a href="#" class="footer__social-link" aria-label="유튜브" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.9 31.9 0 0 0 0 12a31.9 31.9 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31.9 31.9 0 0 0 24 12a31.9 31.9 0 0 0-.5-5.8zM9.5 15.6V8.4l6.3 3.6-6.3 3.6z"/>
        </svg>
      </a>
    </div>
    <p class="footer__orgs">헐버트박사기념사업회 <span>·</span> 함께봄</p>
    <p class="footer__copyright">
      © 2026 아리랑, 130년 전 한국의 보물을 찾다
    </p>
  </footer>

</body>
</html>
