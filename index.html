<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아리랑, 130년 전 한국의 보물을 찾다</title>
  <meta name="description" content="헐버트가 시작한 K-컬쳐 — 헐버트의 저서와 유품으로 만나는 아리랑 이야기. 2026년 3월 19일 ~ 4월 19일, 서울 종로구 함께봄 한옥">
  <meta property="og:title" content="아리랑, 130년 전 한국의 보물을 찾다">
  <meta property="og:description" content="헐버트가 시작한 K-컬쳐 — 무료전시 | 2026.3.19 ~ 4.19">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================
       설정 — 링크 URL을 여기서 일괄 관리
       ============================================ */

    :root {
      /* 색상 팔레트 */
      --color-bg:        #F7F3EE;
      --color-bg-warm:   #EDE8E0;
      --color-ink:       #1A1A1A;
      --color-ink-light: #6B6560;
      --color-red:       #B8352A;
      --color-red-deep:  #8C2820;
      --color-navy:      #1B3A5C;
      --color-navy-light:#2A5580;
      --color-gold:      #C9A96E;
      --color-gold-light:#D4BA85;
      --color-cream:     #FAF7F2;
      --color-border:    #DDD5CA;

      /* 타이포 */
      --font-serif:  'Noto Serif KR', Georgia, serif;
      --font-sans:   'Noto Sans KR', -apple-system, sans-serif;

      /* 레이아웃 */
      --max-width:   460px;
      --padding:     24px;
    }

    /* ============================================
       리셋 & 기본
       ============================================ */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--color-bg);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }

    /* ============================================
       배경 장식 — 한국 전통 격자문양 (CSS 패턴)
       ============================================ */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(45deg, transparent 48%, var(--color-border) 48%, var(--color-border) 52%, transparent 52%),
        linear-gradient(-45deg, transparent 48%, var(--color-border) 48%, var(--color-border) 52%, transparent 52%);
      background-size: 60px 60px;
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
    }

    /* ============================================
       메인 컨테이너
       ============================================ */
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: var(--max-width);
      padding: var(--padding);
      padding-top: 48px;
      padding-bottom: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* ============================================
       헤더 — 전시 정보
       ============================================ */
    .header {
      text-align: center;
      margin-bottom: 40px;
      width: 100%;
    }

    /* 상단 장식선 — 전통 기와 모티프 */
    .header__ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .header__ornament-line {
      width: 48px;
      height: 1px;
      background: var(--color-red);
      opacity: 0.5;
    }

    .header__ornament-diamond {
      width: 8px;
      height: 8px;
      border: 1.5px solid var(--color-red);
      transform: rotate(45deg);
      opacity: 0.6;
    }

    /* 무료전시 뱃지 */
    .badge {
      display: inline-block;
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--color-red);
      border: 1.5px solid var(--color-red);
      padding: 4px 14px;
      border-radius: 2px;
      margin-bottom: 24px;
      animation: fadeSlideUp 0.6s ease both;
    }

    .header__title {
      font-family: var(--font-serif);
      font-weight: 900;
      font-size: 26px;
      line-height: 1.45;
      color: var(--color-ink);
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      word-break: keep-all;
      animation: fadeSlideUp 0.6s ease 0.1s both;
    }

    .header__subtitle {
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 500;
      color: var(--color-navy);
      letter-spacing: 0.06em;
      margin-bottom: 20px;
      animation: fadeSlideUp 0.6s ease 0.2s both;
    }

    .header__desc {
      font-family: var(--font-serif);
      font-size: 14px;
      font-weight: 400;
      color: var(--color-ink-light);
      line-height: 1.7;
      margin-bottom: 24px;
      animation: fadeSlideUp 0.6s ease 0.3s both;
    }

    /* 구분선 — 물결 패턴 SVG */
    .header__divider {
      width: 100%;
      margin-bottom: 20px;
      animation: fadeSlideUp 0.6s ease 0.35s both;
    }

    .header__divider svg {
      display: block;
      width: 100%;
      height: 8px;
    }

    /* 전시 기간/장소 정보 */
    .info-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 8px;
      animation: fadeSlideUp 0.6s ease 0.4s both;
    }

    .info-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-size: 13px;
      line-height: 1.6;
    }

    .info-row__label {
      font-weight: 700;
      color: var(--color-navy);
      white-space: nowrap;
      min-width: 32px;
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    .info-row__value {
      color: var(--color-ink);
      font-weight: 400;
      word-break: keep-all;
    }

    /* ============================================
       링크 버튼 영역
       ============================================ */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 48px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 20px;
      background: var(--color-cream);
      border: 1.5px solid var(--color-border);
      border-radius: 4px;
      text-decoration: none;
      color: var(--color-ink);
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      overflow: hidden;
    }

    /* 호버 시 왼쪽 적색 액센트 라인 */
    .link-btn::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0;
      background: var(--color-red);
      transition: width 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .link-btn:hover {
      border-color: var(--color-red);
      background: #fff;
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(184, 53, 42, 0.08);
    }

    .link-btn:hover::before {
      width: 4px;
    }

    .link-btn:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .link-btn__icon {
      font-size: 20px;
      flex-shrink: 0;
      width: 28px;
      text-align: center;
      z-index: 1;
    }

    .link-btn__text {
      flex: 1;
      z-index: 1;
    }

    .link-btn__arrow {
      font-size: 14px;
      color: var(--color-ink-light);
      transition: transform 0.3s ease, color 0.3s ease;
      z-index: 1;
    }

    .link-btn:hover .link-btn__arrow {
      transform: translateX(3px);
      color: var(--color-red);
    }

    /* 스태거드 애니메이션 */
    .link-btn:nth-child(1) { animation: fadeSlideUp 0.5s ease 0.5s both; }
    .link-btn:nth-child(2) { animation: fadeSlideUp 0.5s ease 0.6s both; }
    .link-btn:nth-child(3) { animation: fadeSlideUp 0.5s ease 0.7s both; }
    .link-btn:nth-child(4) { animation: fadeSlideUp 0.5s ease 0.8s both; }
    .link-btn:nth-child(5) { animation: fadeSlideUp 0.5s ease 0.9s both; }
    .link-btn:nth-child(6) { animation: fadeSlideUp 0.5s ease 1.0s both; }

    /* ============================================
       푸터
       ============================================ */
    .footer {
      margin-top: auto;
      text-align: center;
      width: 100%;
      padding-top: 24px;
      border-top: 1px solid var(--color-border);
      animation: fadeSlideUp 0.5s ease 1.1s both;
    }

    .footer__social {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 16px;
    }

    .footer__social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1.5px solid var(--color-border);
      border-radius: 50%;
      text-decoration: none;
      color: var(--color-ink-light);
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .footer__social-link:hover {
      border-color: var(--color-navy);
      color: var(--color-navy);
      transform: translateY(-2px);
    }

    .footer__text {
      font-size: 11px;
      color: var(--color-ink-light);
      line-height: 1.7;
    }

    .footer__text a {
      color: var(--color-navy);
      text-decoration: none;
    }

    .footer__text a:hover {
      text-decoration: underline;
    }

    /* ============================================
       애니메이션
       ============================================ */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ============================================
       반응형
       ============================================ */
    @media (min-width: 520px) {
      .header__title {
        font-size: 30px;
      }

      .container {
        padding-top: 64px;
        padding-bottom: 64px;
      }
    }

    @media (max-width: 380px) {
      .header__title {
        font-size: 22px;
      }

      .link-btn {
        padding: 14px 16px;
        font-size: 14px;
      }

      .container {
        padding: 20px 16px;
        padding-top: 36px;
      }
    }

    /* 다크모드 기본 대응 */
    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg:        #1A1816;
        --color-bg-warm:   #242120;
        --color-ink:       #E8E2DA;
        --color-ink-light: #9E958A;
        --color-cream:     #222018;
        --color-border:    #3A3530;
        --color-red:       #D4544A;
        --color-navy-light:#5B8BBF;
      }

      .link-btn:hover {
        background: var(--color-bg-warm);
        box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      }
    }
  </style>
</head>
<body>

    </nav>

    <!-- ============================

    <footer class="footer">
      <div class="footer__social">
        <a href="#" class="footer__social-link" aria-label="인스타그램" target="_blank" rel="noopener">
          <!-- 인스타그램 아이콘 (SVG inline) -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      <p class="footer__text">
        © 2026 (주)함께봄 · 아리랑, 130년 전 한국의 보물을 찾다<br>

  </div>

</body>
