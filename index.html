<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아리랑, 130년 전 한국의 보물을 찾다</title>
  <meta name="description" content="헐버트가 시작한 K-컬쳐 — 헐버트의 저서와 유품으로 만나는 아리랑 이야기. 2026년 3월 19일 ~ 4월 19일, 서울 종로구 함께봄 한옥. 무료전시">
  <meta property="og:title" content="아리랑, 130년 전 한국의 보물을 찾다">
  <meta property="og:description" content="헐버트가 시작한 K-컬쳐 — 무료전시 | 2026.3.19 ~ 4.19 | 서울 종로구 함께봄 한옥">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --dancheong-red:     #C23C2B;
      --dancheong-blue:    #1E5B8A;
      --dancheong-yellow:  #E3A829;
      --dancheong-green:   #2D7B56;
      --dancheong-white:   #F4EDE0;
      --ink:         #1C1712;
      --ink-soft:    #3B352D;
      --ink-muted:   #7A7269;
      --cream:       #F8F3EA;
      --cream-deep:  #EDE6D8;
      --gold:        #C9A043;
      --gold-soft:   #DABB6A;
      --border:      #D6CDBF;
      --serif:  'Noto Serif KR', 'Batang', Georgia, serif;
      --sans:   'Noto Sans KR', -apple-system, sans-serif;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--sans);
      background: var(--cream);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* 단청 장식 띠 — 상단 */
    .dancheong-band {
      width: 100%;
      height: 12px;
      background: linear-gradient(to right,
        var(--dancheong-red) 0%, var(--dancheong-red) 20%,
        var(--dancheong-yellow) 20%, var(--dancheong-yellow) 30%,
        var(--dancheong-green) 30%, var(--dancheong-green) 50%,
        var(--dancheong-blue) 50%, var(--dancheong-blue) 70%,
        var(--dancheong-yellow) 70%, var(--dancheong-yellow) 80%,
        var(--dancheong-red) 80%, var(--dancheong-red) 100%
      );
      position: relative;
    }
    .dancheong-band::after {
      content: '';
      position: absolute;
      bottom: -3px;
      left: 0; right: 0;
      height: 3px;
      background: repeating-linear-gradient(90deg,
        var(--dancheong-red) 0px, var(--dancheong-red) 8px,
        var(--dancheong-white) 8px, var(--dancheong-white) 10px,
        var(--dancheong-blue) 10px, var(--dancheong-blue) 18px,
        var(--dancheong-white) 18px, var(--dancheong-white) 20px
      );
    }

    /* 히어로 */
    .hero {
      position: relative;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px 56px;
      background: var(--dancheong-white);
      text-align: center;
      overflow: hidden;
    }
    /* 꽃살문 격자 패턴 */
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at center, rgba(194,60,43,0.04) 1px, transparent 1px),
        linear-gradient(0deg, transparent 49.5%, rgba(194,60,43,0.03) 49.5%, rgba(194,60,43,0.03) 50.5%, transparent 50.5%),
        linear-gradient(90deg, transparent 49.5%, rgba(194,60,43,0.03) 49.5%, rgba(194,60,43,0.03) 50.5%, transparent 50.5%);
      background-size: 40px 40px;
      pointer-events: none;
    }
    /* 좌측 단청 세로선 */
    .hero::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0; left: 16px;
      width: 4px;
      background: repeating-linear-gradient(180deg,
        var(--dancheong-red) 0px, var(--dancheong-red) 20px,
        var(--dancheong-white) 20px, var(--dancheong-white) 24px,
        var(--dancheong-blue) 24px, var(--dancheong-blue) 44px,
        var(--dancheong-white) 44px, var(--dancheong-white) 48px,
        var(--dancheong-green) 48px, var(--dancheong-green) 68px,
        var(--dancheong-white) 68px, var(--dancheong-white) 72px
      );
      opacity: 0.35;
    }
    .hero-right-line {
      position: absolute;
      top: 0; bottom: 0; right: 16px;
      width: 4px;
      background: repeating-linear-gradient(180deg,
        var(--dancheong-blue) 0px, var(--dancheong-blue) 20px,
        var(--dancheong-white) 20px, var(--dancheong-white) 24px,
        var(--dancheong-red) 24px, var(--dancheong-red) 44px,
        var(--dancheong-white) 44px, var(--dancheong-white) 48px,
        var(--dancheong-green) 48px, var(--dancheong-green) 68px,
        var(--dancheong-white) 68px, var(--dancheong-white) 72px
      );
      opacity: 0.35;
      z-index: 0;
    }
    .hero__content {
      position: relative;
      z-index: 1;
      max-width: 440px;
      width: 100%;
    }
    .hero__badge {
      display: inline-block;
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--dancheong-red);
      border: 1.5px solid var(--dancheong-red);
      padding: 5px 20px;
      margin-bottom: 28px;
      animation: fadeIn 0.8s ease both;
    }
    .hero__lotus {
      margin-bottom: 20px;
      animation: fadeIn 0.8s ease 0.1s both;
    }
    .hero__title {
      font-family: var(--serif);
      font-weight: 900;
      font-size: clamp(30px, 8vw, 44px);
      line-height: 1.4;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 20px;
      word-break: keep-all;
      animation: titleReveal 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
    }
    .hero__title em {
      font-style: normal;
      color: var(--dancheong-red);
    }
    .hero__divider {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      width: 120px;
      height: 6px;
      animation: fadeIn 0.8s ease 0.4s both;
    }
    .hero__divider span { flex: 1; height: 100%; }
    .hero__divider span:nth-child(1) { background: var(--dancheong-green); }
    .hero__divider span:nth-child(2) { background: var(--dancheong-red); }
    .hero__divider span:nth-child(3) { background: var(--dancheong-yellow); }
    .hero__divider span:nth-child(4) { background: var(--dancheong-blue); }
    .hero__divider span:nth-child(5) { background: var(--dancheong-green); }
    .hero__subtitle {
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--dancheong-blue);
      margin-bottom: 12px;
      animation: fadeSlideUp 0.7s ease 0.5s both;
    }
    .hero__desc {
      font-family: var(--serif);
      font-size: 14px;
      font-weight: 400;
      color: var(--ink-muted);
      line-height: 1.8;
      margin-bottom: 32px;
      animation: fadeSlideUp 0.7s ease 0.6s both;
    }
    .hero__info {
      background: rgba(255,255,255,0.6);
      border: 1.5px solid var(--border);
      border-top: 3px solid var(--dancheong-red);
      border-bottom: 3px solid var(--dancheong-blue);
      padding: 20px 24px;
      width: 100%;
      max-width: 340px;
      margin: 0 auto 20px;
      animation: fadeSlideUp 0.7s ease 0.7s both;
    }
    .hero__info-row {
      display: flex;
      gap: 12px;
      font-size: 13px;
      line-height: 1.65;
      color: var(--ink-soft);
    }
    .hero__info-row + .hero__info-row {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .hero__info-label {
      font-weight: 700;
      color: var(--dancheong-red);
      white-space: nowrap;
      min-width: 28px;
      font-size: 11px;
      letter-spacing: 0.06em;
    }
    .hero__instagram {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--ink-muted);
      animation: fadeSlideUp 0.7s ease 0.8s both;
    }
    .hero__instagram svg { width: 14px; height: 14px; color: var(--ink-muted); }
    .hero__scroll {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      animation: fadeIn 1s ease 1.2s both;
    }
    .hero__scroll-dot {
      width: 1px;
      height: 20px;
      background: linear-gradient(to bottom, var(--dancheong-red), transparent);
      animation: scrollPulse 2s ease-in-out infinite;
      opacity: 0.4;
    }
    @keyframes scrollPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }

    /* 단청 디바이더 */
    .dancheong-divider {
      width: 100%;
      padding: 0 24px;
      display: flex;
      justify-content: center;
    }
    .dancheong-divider__inner {
      width: 100%;
      max-width: 460px;
      height: 24px;
      position: relative;
      display: flex;
      align-items: center;
    }
    .dancheong-divider__center {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      background: var(--cream);
      padding: 0 12px;
    }
    .dancheong-divider__line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--dancheong-red) 20%, var(--dancheong-yellow) 40%, var(--dancheong-green) 60%, var(--dancheong-blue) 80%, transparent);
      opacity: 0.4;
    }

    /* 링크 섹션 */
    .links-section {
      padding: 36px 24px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .links {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 17px 20px;
      background: rgba(255,255,255,0.7);
      border: 1.5px solid var(--border);
      border-left: 4px solid var(--dancheong-red);
      text-decoration: none;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .link-btn:nth-child(2) { border-left-color: var(--dancheong-blue); }
    .link-btn:nth-child(3) { border-left-color: var(--dancheong-green); }
    .link-btn:nth-child(4) { border-left-color: var(--dancheong-yellow); }
    .link-btn:hover {
      background: #fff;
      transform: translateX(4px);
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .link-btn__icon { font-size: 20px; flex-shrink: 0; width: 28px; text-align: center; }
    .link-btn__text { flex: 1; }
    .link-btn__arrow {
      font-size: 14px;
      color: var(--ink-muted);
      transition: transform 0.3s ease, color 0.3s ease;
    }
    .link-btn:hover .link-btn__arrow { transform: translateX(4px); color: var(--dancheong-red); }
    .link-btn:nth-child(2):hover .link-btn__arrow { color: var(--dancheong-blue); }
    .link-btn:nth-child(3):hover .link-btn__arrow { color: var(--dancheong-green); }
    .link-btn:nth-child(4):hover .link-btn__arrow { color: var(--dancheong-yellow); }
    .link-btn { opacity: 0; animation: fadeSlideUp 0.5s ease both; }
    .link-btn:nth-child(1) { animation-delay: 0.1s; }
    .link-btn:nth-child(2) { animation-delay: 0.18s; }
    .link-btn:nth-child(3) { animation-delay: 0.26s; }
    .link-btn:nth-child(4) { animation-delay: 0.34s; }

    /* QR */
    .qr-section {
      padding: 32px 24px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .qr-label {
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-muted);
      letter-spacing: 0.08em;
      margin-bottom: 14px;
    }
    .qr-placeholder {
      width: 130px; height: 130px;
      border: 2px dashed var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.6);
    }
    .qr-placeholder__inner { font-size: 11px; color: var(--ink-muted); text-align: center; line-height: 1.5; }
    .qr-placeholder img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .qr-caption { font-size: 11px; color: var(--ink-muted); margin-top: 8px; }

    /* 푸터 */
    .footer {
      padding: 28px 24px 20px;
      text-align: center;
      width: 100%;
      background: var(--cream-deep);
      border-top: 1px solid var(--border);
    }
    .footer__social { display: flex; justify-content: center; gap: 14px; margin-bottom: 16px; }
    .footer__social-link {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px;
      border: 1px solid var(--border);
      border-radius: 50%;
      text-decoration: none;
      color: var(--ink-muted);
      transition: all 0.3s ease;
    }
    .footer__social-link:hover { border-color: var(--dancheong-blue); color: var(--dancheong-blue); transform: translateY(-2px); }
    .footer__orgs { font-family: var(--serif); font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; }
    .footer__orgs span { color: var(--ink-muted); font-weight: 400; margin: 0 4px; }
    .footer__copyright { font-size: 10px; color: var(--ink-muted); line-height: 1.5; }
    .dancheong-band--bottom {
      width: 100%; height: 8px;
      background: linear-gradient(to right,
        var(--dancheong-blue) 0%, var(--dancheong-blue) 20%,
        var(--dancheong-yellow) 20%, var(--dancheong-yellow) 30%,
        var(--dancheong-red) 30%, var(--dancheong-red) 50%,
        var(--dancheong-green) 50%, var(--dancheong-green) 70%,
        var(--dancheong-yellow) 70%, var(--dancheong-yellow) 80%,
        var(--dancheong-blue) 80%, var(--dancheong-blue) 100%
      );
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes titleReveal { from { opacity: 0; transform: translateY(24px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

    @media (min-width: 520px) {
      .hero { padding: 80px 40px 56px; }
      .hero::after { left: 24px; }
      .hero-right-line { right: 24px; }
    }
    @media (max-width: 380px) {
      .hero { padding: 60px 20px 44px; }
      .hero__badge { font-size: 10px; }
      .hero__info { padding: 16px 18px; }
      .link-btn { padding: 14px 16px; font-size: 14px; }
      .hero::after { left: 10px; }
      .hero-right-line { right: 10px; }
      .qr-placeholder { width: 110px; height: 110px; }
    }
  </style>
</head>

    <div class="hero-right-line" aria-hidden="true"></div>

  <section class="links-section">

  <div class="dancheong-divider" aria-hidden="true"><div class="dancheong-divider__inner"><div class="dancheong-divider__line"></div><div class="dancheong-divider__center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 2 L22 12 L12 22 L2 12 Z" stroke="#2D7B56" stroke-width="1.2" fill="none"/><path d="M12 6 L18 12 L12 18 L6 12 Z" stroke="#C23C2B" stroke-width="0.8" fill="none"/><circle cx="12" cy="12" r="2" fill="#E3A829" opacity="0.6"/></svg></div><div class="dancheong-divider__line"></div></div></div>

  <section class="qr-section">
    <p class="qr-label">전시 관련 QR</p>

  <footer class="footer">
