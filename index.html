<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아리랑, 130년 전 한국의 보물을 찾다</title>
  <meta name="description" content="헐버트가 시작한 K-컬쳐 — 헐버트의 저서와 유품으로 만나는 아리랑 이야기. 2026년 3월 19일 ~ 4월 19일, 서울 종로구 함께봄 한옥. 무료전시">
  <meta property="og:title" content="아리랑, 130년 전 한국의 보물을 찾다">
  <meta property="og:description" content="헐버트가 시작한 K-컬쳐 — 무료전시 | 2026.3.19 ~ 4.19">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --dark: #0D0B14;
      --purple-deep: #1A1230;
      --purple-mid: #2D1F5E;
      --purple-light: #7B5EA7;
      --violet: #A78BFA;
      --lavender: #C4B5FD;
      --rose: #E879A8;
      --white: #F8F7FF;
      --serif: 'Noto Serif KR', Georgia, serif;
      --sans: 'Noto Sans KR', -apple-system, sans-serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--sans);
      background: var(--dark);
      color: var(--white);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── 페이지 ── */
    .page {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100svh;
    }

    /* ── 히어로 ── */
    .hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(170deg, var(--dark) 0%, var(--purple-deep) 25%, var(--purple-mid) 55%, var(--purple-deep) 80%, var(--dark) 100%);
      min-height: 480px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 32px 40px;
    }

    /* 보라/핑크 글로우 */
    .hero::before {
      content: '';
      position: absolute;
      top: -15%;
      right: -25%;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(167, 139, 250, .2) 0%, rgba(232, 121, 168, .08) 40%, transparent 70%);
      animation: glow 7s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .hero::after {
      content: '';
      position: absolute;
      bottom: -5%;
      left: -15%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(196, 181, 253, .12) 0%, transparent 65%);
      animation: glow 9s ease-in-out 3s infinite alternate;
      pointer-events: none;
    }

    /* 히어로 상단 태그 */
    .hero__tag {
      position: absolute;
      top: 40px;
      left: 32px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .2em;
      color: var(--lavender);
      text-transform: uppercase;
      opacity: 0;
      animation: fadeIn .8s ease .3s both;
      z-index: 2;
    }

    /* 히어로 콘텐츠 */
    .hero__content {
      position: relative;
      z-index: 2;
    }
    .hero__sub {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .12em;
      color: var(--rose);
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeUp .6s ease .4s both;
    }
    .hero__title {
      font-family: var(--serif);
      font-weight: 900;
      font-size: clamp(34px, 9.5vw, 50px);
      line-height: 1.25;
      letter-spacing: -.02em;
      color: var(--white);
      margin-bottom: 20px;
      word-break: keep-all;
      opacity: 0;
      animation: fadeUp .8s ease .5s both;
    }
    .hero__title em {
      font-style: normal;
      background: linear-gradient(135deg, var(--violet) 0%, var(--rose) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero__desc {
      font-family: var(--serif);
      font-size: 14px;
      color: rgba(248, 247, 255, .55);
      line-height: 1.8;
      opacity: 0;
      animation: fadeUp .6s ease .7s both;
    }

    /* ── 구분선 ── */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(167, 139, 250, .2), transparent);
      margin: 0 32px;
    }

    /* ── 전시 정보 ── */
    .info {
      padding: 32px 32px 28px;
    }
    .info__items {
      display: flex;
      flex-direction: column;
      gap: 16px;
      opacity: 0;
      animation: fadeUp .6s ease .8s both;
    }
    .info__item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .info__icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(167, 139, 250, .1);
      border: 1px solid rgba(167, 139, 250, .15);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 15px;
    }
    .info__detail {
      flex: 1;
      padding-top: 2px;
    }
    .info__label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      color: var(--lavender);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .info__value {
      font-size: 13px;
      color: rgba(248, 247, 255, .7);
      line-height: 1.5;
    }
    .info__badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      color: var(--rose);
      background: rgba(232, 121, 168, .1);
      border: 1px solid rgba(232, 121, 168, .2);
      padding: 6px 14px;
      border-radius: 20px;
      margin-top: 16px;
      opacity: 0;
      animation: fadeUp .6s ease .9s both;
    }
    .info__insta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      color: rgba(248, 247, 255, .35);
      margin-top: 20px;
      opacity: 0;
      animation: fadeUp .6s ease 1s both;
    }
    .info__insta svg { width: 13px; height: 13px; flex-shrink: 0; opacity: .6; }

    /* ── 링크 ── */
    .links {
      padding: 4px 32px 32px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      background: linear-gradient(135deg, rgba(167, 139, 250, .06) 0%, rgba(232, 121, 168, .03) 100%);
      border: 1px solid rgba(167, 139, 250, .1);
      border-radius: 12px;
      text-decoration: none;
      color: var(--white);
      font-size: 14px;
      font-weight: 500;
      transition: all .25s ease;
    }
    .link:hover {
      background: linear-gradient(135deg, rgba(167, 139, 250, .12) 0%, rgba(232, 121, 168, .06) 100%);
      border-color: var(--violet);
      transform: translateY(-2px);
      box-shadow: 0 4px 24px rgba(167, 139, 250, .15);
    }
    .link__icon {
      font-size: 20px;
      width: 28px;
      text-align: center;
      flex-shrink: 0;
    }
    .link__text { flex: 1; }
    .link__arrow {
      font-size: 14px;
      color: rgba(248, 247, 255, .25);
      transition: all .25s ease;
    }
    .link:hover .link__arrow {
      color: var(--violet);
      transform: translateX(4px);
    }

    /* 링크 스태거 */
    .link { opacity: 0; animation: fadeUp .4s ease both; }
    .link:nth-child(1) { animation-delay: 1.05s; }
    .link:nth-child(2) { animation-delay: 1.1s; }
    .link:nth-child(3) { animation-delay: 1.15s; }
    .link:nth-child(4) { animation-delay: 1.2s; }

    /* ── 푸터 ── */
    .footer {
      padding: 28px 32px 36px;
      text-align: center;
      border-top: 1px solid rgba(167, 139, 250, .08);
    }
    .footer__social {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 16px;
    }
    .footer__social a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(167, 139, 250, .12);
      border-radius: 50%;
      color: rgba(248, 247, 255, .4);
      text-decoration: none;
      transition: all .25s ease;
    }
    .footer__social a:hover {
      border-color: var(--violet);
      color: var(--violet);
    }
    .footer__org {
      font-family: var(--serif);
      font-size: 12px;
      font-weight: 700;
      color: rgba(248, 247, 255, .35);
      margin-bottom: 6px;
    }
    .footer__copy {
      font-size: 10px;
      color: rgba(248, 247, 255, .18);
    }

    /* ── 애니메이션 ── */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes glow {
      from { opacity: .5; transform: scale(1); }
      to { opacity: 1; transform: scale(1.2); }
    }

    /* ── 반응형 ── */
    @media (max-width: 380px) {
      .hero { padding: 0 24px 32px; }
      .hero__tag { left: 24px; top: 32px; }
      .info, .links, .footer { padding-left: 24px; padding-right: 24px; }
      .divider { margin: 0 24px; }
    }
    @media (min-width: 481px) {
      .page {
        border-left: 1px solid rgba(167, 139, 250, .06);
        border-right: 1px solid rgba(167, 139, 250, .06);
      }
    }
  </style>
</head>
<body>

<div class="page">

  <!-- 히어로 -->
  <header class="hero">

  <div class="divider"></div>

  <!-- 링크 -->
  <nav class="links" aria-label="전시 관련 링크">

    <a href="#" class="link" target="_blank" rel="noopener">
      <span class="link__icon">💌</span>
      <span class="link__text">문의하기</span>
      <span class="link__arrow">→</span>
    </a>
  </nav>

  <!-- 푸터 -->
  <footer class="footer">
    <div class="footer__social">
      <a href="#" aria-label="인스타그램"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/></svg></a>
      <a href="#" aria-label="유튜브"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.9 31.9 0 0 0 0 12a31.9 31.9 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31.9 31.9 0 0 0 24 12a31.9 31.9 0 0 0-.5-5.8zM9.5 15.6V8.4l6.3 3.6-6.3 3.6z"/></svg></a>
    </div>
    <p class="footer__org">헐버트박사기념사업회 · 함께봄</p>
    <p class="footer__copy">© 2026 아리랑, 130년 전 한국의 보물을 찾다</p>
  </footer>

</div>

</body>
</html>
